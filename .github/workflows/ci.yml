name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Core only — the heavy `whitebox` extra (torch) is not needed for CI; its
      # one functional test skips when torch is absent.
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Smoke-test the CLI end to end
        run: |
          glassbox demo
          glassbox audit --demo || test $? -eq 1
          glassbox batch --demo || test $? -eq 1
          glassbox calibrate --demo || test $? -eq 1
          glassbox audit --demo --json | python -c "import sys, json; json.load(sys.stdin)"
        shell: bash
