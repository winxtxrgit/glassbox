# Publishes to PyPI when a GitHub release is published, using Trusted Publishing
# (OIDC) — no API token stored in this repository. Set up the pending publisher
# on pypi.org first (project glassbox, owner winxtxrgit, repo glassbox, workflow
# publish.yml, environment pypi), then publish a release to trigger this.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/glassbox/
    permissions:
      id-token: write # Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1.2,<2" "twine>=6,<7"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
