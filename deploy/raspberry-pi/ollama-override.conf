# Installed by setup-pi.sh as /etc/systemd/system/ollama.service.d/glassbox.conf
[Service]
# Listen on the LAN (ufw limits who can actually reach it). Ollama has no auth.
Environment="OLLAMA_HOST=0.0.0.0:11434"
# A Pi can only run one generation at a time; queueing beats thrashing.
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
# Keep the model in RAM between jobs: a cold load costs several seconds.
Environment="OLLAMA_KEEP_ALIVE=30m"
