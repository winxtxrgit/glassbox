[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
# The distribution is "glassbox-audit" because "glassbox" on PyPI is an unrelated
# project. The import package and the CLI command are still `glassbox`.
name = "glassbox-audit"
dynamic = ["version"]
description = "Explainable LLM triage that cites its evidence — and a harness that checks whether the explanation is faithful."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Thanut Jongteerathanachote", email = "winxtxr.github@gmail.com" }]
keywords = [
    "llm",
    "interpretability",
    "explainability",
    "faithfulness",
    "hallucination",
    "grounding",
    "ai-safety",
    "audit",
    "ollama",
    "qwen",
    "open-weights",
]
# License is declared via the SPDX `license` field above, so no License classifier
# here (it would duplicate the expression and newer tooling rejects that).
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
    "Typing :: Typed",
]
# No third-party dependencies: the local backend talks to Ollama over plain HTTP
# via the standard library, so `glassbox` installs and imports with nothing else.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
# Phase 5 only: look inside a small local model. Heavy, hence optional — the core
# package and the black-box analyses (triage/probe/stress/calibrate) need neither.
whitebox = ["torch>=2", "transformers>=4"]

[project.scripts]
glassbox = "glassbox.cli:main"

[project.urls]
Homepage = "https://github.com/winxtxrgit/glassbox"
Documentation = "https://github.com/winxtxrgit/glassbox#readme"
Repository = "https://github.com/winxtxrgit/glassbox"
Issues = "https://github.com/winxtxrgit/glassbox/issues"
Changelog = "https://github.com/winxtxrgit/glassbox/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/glassbox/__init__.py"

[tool.hatch.build.targets.wheel]
# The package directory doesn't match the distribution name, so name it here.
packages = ["src/glassbox"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
# docs/ holds plan/writeup markdown (with illustrative code snippets) — not source.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The few-shot block embeds example model outputs as single-line JSON; those
# lines are illustrative content, not code, and shouldn't be wrapped.
"src/glassbox/prompts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
